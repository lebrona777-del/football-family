<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#082714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach Board">
<link rel="manifest" href="manifest.webmanifest">
<title>Coach Board — Football Training</title>
<style>
:root{--green:#0b2816;--pitch:#31874a;--pitch2:#3b9755;--ink:#10251a;--panel:#fff;--muted:#66736b;--accent:#218a49;--danger:#c93636}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#eef3ef;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
.top{background:linear-gradient(135deg,#071d0f,#123c20);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 16px}
.top h1{margin:0;font-size:24px}.top p{margin:4px 0 0;color:#cbd9cf}
.wrap{max-width:1100px;margin:auto;padding:14px}
.card{background:#fff;border-radius:20px;box-shadow:0 5px 22px #12281914;margin-bottom:14px;padding:14px}
.meta{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
label{font-size:12px;color:var(--muted);font-weight:700}input,select,textarea{width:100%;border:1px solid #d5ded8;border-radius:12px;padding:11px;background:#fff;color:var(--ink);outline:none}
textarea{min-height:70px;resize:vertical}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.tool{background:#f5f8f6;border:1px solid #dbe4de;border-radius:12px;padding:10px 12px;font-weight:700}
.tool.active{background:#d9f0df;border-color:#5cab72;color:#12622e}
.tool.danger{background:#fff0f0;color:#a82020}
.primary{background:#258b4b;color:#fff}.dark{background:#123b21;color:#fff}
.pitchCard{padding:10px}
.pitchWrap{position:relative;width:100%;aspect-ratio:1.72;border-radius:18px;overflow:hidden;background:#2f8548;touch-action:none;box-shadow:inset 0 0 0 5px #66b477,0 10px 30px #0b2c1640}
.pitch{position:absolute;inset:0;overflow:hidden;touch-action:none;background:
linear-gradient(90deg,transparent 49.7%,#b9dfbf 49.7%,#b9dfbf 50.3%,transparent 50.3%),
radial-gradient(circle at 50% 50%,transparent 0 9.5%,#b9dfbf 9.5% 10.1%,transparent 10.1%),
linear-gradient(#ffffff22,#ffffff22)}
.pitch:before{content:"";position:absolute;inset:3%;border:4px solid #c6e4cb;border-radius:4px}
.pitch:after{content:"";position:absolute;left:3%;right:3%;top:50%;height:2px;background:#c6e4cb}
.box{position:absolute;top:30%;height:40%;width:14%;border:4px solid #c6e4cb}.box.left{left:3%}.box.right{right:3%}
.goal{position:absolute;top:43%;height:14%;width:2%;border:3px solid #fff;background:#ffffff33}.goal.left{left:1%}.goal.right{right:1%}
.object{position:absolute;transform:translate(-50%,-50%);user-select:none;touch-action:none;z-index:5}
.player{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;border:3px solid #fff;box-shadow:0 2px 8px #0005}
.red{background:#d93636}.blue{background:#2167d8}
.ball{font-size:32px;line-height:1}.cone{font-size:30px}.man{font-size:34px}
.label{font-size:11px;background:#fff;padding:2px 5px;border-radius:5px;white-space:nowrap;box-shadow:0 1px 4px #0003}
.zone{position:absolute;border:3px dashed #fff8;border-radius:10px;background:#ffffff14;z-index:2}
.svgLayer{position:absolute;inset:0;width:100%;height:100%;z-index:3;overflow:visible;pointer-events:none}
.svgLayer path,.svgLayer line{vector-effect:non-scaling-stroke}
.float{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:100;display:flex;gap:8px}
.float button{width:52px;height:52px;border-radius:50%;background:#123b21;color:#fff;font-size:22px;box-shadow:0 5px 18px #0004}
#boardMode{display:none;position:fixed;inset:0;z-index:1000;background:#06140a}
#boardMode.show{display:block}
#boardMode .pitchWrap{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;box-shadow:none}
#boardMode .pitch{inset:0}
.modebar{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;z-index:30;display:flex;gap:7px;overflow-x:auto;padding-bottom:4px}
.modebar button{flex:0 0 auto;background:#ffffffea;color:#10251a;border-radius:12px;padding:9px 11px;font-weight:800}
.modebar .on{background:#258b4b;color:#fff}
.closeMode{position:absolute;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;border-radius:14px;background:#fff;color:#123b21;padding:12px 16px;font-weight:900}
.list{display:grid;gap:8px}.saved{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #dbe4de;border-radius:12px;padding:10px}
.saved b{display:block}.small{font-size:12px;color:var(--muted)}
.planRow{display:grid;grid-template-columns:1fr 90px 42px;gap:8px;margin:7px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);opacity:0;background:#10251a;color:#fff;padding:11px 15px;border-radius:12px;z-index:2000;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}
.empty{color:#748078;text-align:center;padding:16px}
@media(max-width:650px){.meta{grid-template-columns:1fr 1fr}.meta label:first-child{grid-column:1/-1}.player{width:36px;height:36px;font-size:13px}.tool{padding:9px 10px}.pitchCard{padding:5px}.card{border-radius:16px}.planRow{grid-template-columns:1fr 70px 40px}}
</style>
</head>
<body>
<header class="top"><div class="wrap" style="padding:0"><h1>⚽ COACH BOARD</h1><p>მწვრთნელის ციფრული ტაქტიკური დაფა</p></div></header>
<main class="wrap">
<section class="card">
<div class="meta">
<label>ვარჯიშის სახელი<input id="title" placeholder="მაგ: პასი და მოძრაობა"></label>
<label>თარიღი<input id="date" type="date"></label>
<label>ხანგრძლივობა<select id="duration"><option>15 წთ</option><option selected>30 წთ</option><option>45 წთ</option><option>60 წთ</option><option>90 წთ</option></select></label>
</div>
<label style="display:block;margin-top:10px">მიზანი<textarea id="notes" placeholder="რას ვასწავლით დღეს?"></textarea></label>
</section>

<section class="card">
<div class="toolbar" id="tools">
<button class="tool active" data-tool="select">👆 არჩევა</button>
<button class="tool" data-tool="red">🔴 მოთამაშე</button>
<button class="tool" data-tool="blue">🔵 მოწინააღმდეგე</button>
<button class="tool" data-tool="ball">⚽ ბურთი</button>
<button class="tool" data-tool="cone">🔶 კონუსი</button>
<button class="tool" data-tool="man">🧍 მანეკენი</button>
<button class="tool" data-tool="arrow">➡️ ისარი</button>
<button class="tool" data-tool="line">➖ ხაზი</button>
<button class="tool" data-tool="zone">🟩 ზონა</button>
<button class="tool" data-tool="text">T ტექსტი</button>
<button class="tool danger" data-tool="erase">🗑️ წაშლა</button>
</div>
<div class="toolbar" style="margin-top:8px">
<button class="tool" id="undo">↩️ Undo</button><button class="tool" id="redo">↪️ Redo</button>
<button class="tool" id="formation">📐 ფორმაცია</button><button class="tool" id="clear">🧹 დაფის გასუფთავება</button>
<button class="tool primary" id="save">💾 შენახვა</button><button class="tool dark" id="boardOpen">⛶ დიდი დაფა</button>
</div>
</section>

<section class="card pitchCard">
<div class="pitchWrap" id="pitchWrap">
<div class="pitch" id="pitch"><div class="box left"></div><div class="box right"></div><div class="goal left"></div><div class="goal right"></div>
<svg class="svgLayer" id="svg" viewBox="0 0 1000 581" preserveAspectRatio="none"></svg>
</div></div>
<div class="small" style="margin-top:8px">💡 დაფაზე დაჭერით არჩეული ხელსაწყო დაემატება. მოთამაშეები და ობიექტები თითით გადაადგილდება. ისარი/ხაზი — თითის გასმით.</div>
</section>

<section class="card">
<h3 style="margin:0 0 10px">🏃 ვარჯიშის გეგმა</h3>
<div id="plan"></div>
<button class="tool primary" id="addStage">＋ ეტაპის დამატება</button>
</section>

<section class="card">
<h3 style="margin:0 0 10px">💾 შენახული ვარჯიშები</h3>
<div id="saved" class="list"></div>
</section>
</main>

<div class="float"><button id="quickSave">💾</button><button id="quickFull">⛶</button></div>

<div id="boardMode">
<div class="modebar" id="modeTools"></div>
<div class="pitchWrap"><div class="pitch" id="fullPitch"></div></div>
<button class="closeMode" id="closeMode">✕ დახურვა</button>
</div>
<div id="toast" class="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const pitch=$('#pitch'), svg=$('#svg'), title=$('#title'), date=$('#date'), notes=$('#notes'), duration=$('#duration');
let tool='select', objects=[], strokes=[], history=[], future=[], drag=null, draw=null, boardMode=false;
let plans=[];
date.value=new Date().toISOString().slice(0,10);

function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1700)}
function snapshot(){history.push(JSON.stringify(state()));if(history.length>40)history.shift();future=[]}
function state(){return {objects:objects.map(o=>({...o})),strokes:strokes.map(s=>({...s,pts:s.pts.map(p=>({...p}))}))}}
function restore(s){objects=s.objects||[];strokes=s.strokes||[];render()}
function undo(){if(!history.length)return;future.push(JSON.stringify(state()));restore(JSON.parse(history.pop()))}
function redo(){if(!future.length)return;history.push(JSON.stringify(state()));restore(JSON.parse(future.pop()))}
$('#undo').onclick=undo;$('#redo').onclick=redo;

$$('#tools .tool').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;$$('#tools .tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');setModeTool(tool)});
function setModeTool(t){$$('#modeTools button').forEach(b=>b.classList.toggle('on',b.dataset.tool===t))}

function pt(e,el=pitch){let r=el.getBoundingClientRect();return {x:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y:Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))}}
function addObj(type,x,y,extra={}){snapshot();objects.push({id:Date.now()+Math.random(),type,x,y,...extra});render()}
function render(){
pitch.querySelectorAll('.object,.zone,.label').forEach(x=>x.remove());
objects.forEach(o=>{
 let el=document.createElement('div');el.className='object';el.dataset.id=o.id;el.style.left=o.x+'%';el.style.top=o.y+'%';
 if(o.type==='red'||o.type==='blue'){el.className+=' player '+o.type;el.textContent=o.num||''; if(o.name){let l=document.createElement('div');l.className='label';l.textContent=o.name;el.appendChild(l)}}
 if(o.type==='ball')el.className+=' ball',el.textContent='⚽';
 if(o.type==='cone')el.className+=' cone',el.textContent='🔶';
 if(o.type==='man')el.className+=' man',el.textContent='🧍';
 if(o.type==='text')el.className+=' label',el.textContent=o.text||'ტექსტი';
 if(o.type==='zone'){el.className='zone';el.style.width=(o.w||18)+'%';el.style.height=(o.h||18)+'%';el.style.transform='translate(-50%,-50%)';}
 pitch.appendChild(el);el.addEventListener('pointerdown',objectDown);
});
svg.innerHTML='';
strokes.forEach(s=>{
 let d=s.pts.map((p,i)=>(i?'L':'M')+p.x*10+' '+p.y*5.81).join(' ');
 let path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);path.setAttribute('fill','none');path.setAttribute('stroke',s.kind==='arrow'?'#fff':'#ffe56b');path.setAttribute('stroke-width',s.kind==='arrow'?5:4);path.setAttribute('stroke-linecap','round');path.setAttribute('stroke-linejoin','round');svg.appendChild(path);
 if(s.kind==='arrow'&&s.pts.length>1){let a=s.pts.at(-2),b=s.pts.at(-1),ang=Math.atan2(b.y-a.y,b.x-a.x),len=3.2;let p1={x:b.x-Math.cos(ang-.5)*len,y:b.y-Math.sin(ang-.5)*len},p2={x:b.x-Math.cos(ang+.5)*len,y:b.y-Math.sin(ang+.5)*len};let q=document.createElementNS('http://www.w3.org/2000/svg','path');q.setAttribute('d',`M ${b.x*10} ${b.y*5.81} L ${p1.x*10} ${p1.y*5.81} M ${b.x*10} ${b.y*5.81} L ${p2.x*10} ${p2.y*5.81}`);q.setAttribute('stroke','#fff');q.setAttribute('stroke-width','5');q.setAttribute('fill','none');svg.appendChild(q)}
 });
 renderPlan();renderSaved();
}
function objectDown(e){
 e.stopPropagation(); if(tool==='erase'){snapshot();objects=objects.filter(o=>String(o.id)!==e.currentTarget.dataset.id);render();return}
 if(tool!=='select')return;
 let id=+e.currentTarget.dataset.id,o=objects.find(x=>x.id===id);if(!o)return;snapshot();drag={id,start:pt(e),orig:{x:o.x,y:o.y}};e.currentTarget.setPointerCapture(e.pointerId);
}
pitch.addEventListener('pointermove',e=>{if(!drag)return;let p=pt(e),o=objects.find(x=>x.id===drag.id);o.x=p.x;o.y=p.y;render()});
pitch.addEventListener('pointerup',()=>{if(drag){drag=null;saveAutos()}});

pitch.addEventListener('pointerdown',e=>{
 if(e.target!==pitch && !e.target.classList.contains('pitch'))return;
 let p=pt(e);
 if(tool==='select')return;
 if(tool==='red'||tool==='blue'){let num=prompt('მოთამაშის ნომერი?','10');if(num!==null)addObj(tool,p.x,p.y,{num});return}
 if(tool==='ball'||tool==='cone'||tool==='man'){addObj(tool,p.x,p.y);return}
 if(tool==='text'){let t=prompt('რა ტექსტი დავწეროთ?','პასი და მოძრაობა');if(t)addObj('text',p.x,p.y,{text:t});return}
 if(tool==='zone'){addObj('zone',p.x,p.y,{w:20,h:20});return}
 if(tool==='arrow'||tool==='line'){snapshot();draw={kind:tool,pts:[p]};}
});
pitch.addEventListener('pointermove',e=>{if(draw){draw.pts.push(pt(e));renderTemp()}})
pitch.addEventListener('pointerup',()=>{if(draw){if(draw.pts.length>1)strokes.push(draw);draw=null;render();saveAutos()}})
function renderTemp(){render();if(!draw)return;let d=draw.pts.map((p,i)=>(i?'L':'M')+p.x*10+' '+p.y*5.81).join(' ');let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke','#fff');p.setAttribute('stroke-width','5');p.setAttribute('stroke-linecap','round');svg.appendChild(p)}

function formation(name='4-3-3'){snapshot();objects=objects.filter(o=>!['red','blue'].includes(o.type));let sets={ '4-3-3':[ [8,50],[25,18],[25,39],[25,61],[25,82],[48,25],[48,50],[48,75],[75,22],[78,50],[75,78]], '4-4-2':[[8,50],[25,18],[25,39],[25,61],[25,82],[48,18],[48,39],[48,61],[48,82],[76,40],[76,60]], '3-5-2':[[8,50],[27,25],[27,50],[27,75],[50,15],[50,35],[50,50],[50,65],[50,85],[77,38],[77,62]], '4-2-3-1':[[8,50],[25,18],[25,39],[25,61],[25,82],[43,36],[43,64],[61,22],[61,50],[61,78],[80,50]]};(sets[name]||sets['4-3-3']).forEach((p,i)=>objects.push({id:Date.now()+i,type:'red',x:p[0],y:p[1],num:i+1}));render();saveAutos()}
$('#formation').onclick=()=>{let n=prompt('ფორმაცია: 4-3-3, 4-4-2, 3-5-2 ან 4-2-3-1','4-3-3');if(n)formation(n)}

$('#clear').onclick=()=>{if(confirm('დაფა მთლიანად გავასუფთავოთ?')){snapshot();objects=[];strokes=[];render()}}

function saveData(){return {title:title.value||'ჩემი ვარჯიში',date:date.value,duration:duration.value,notes:notes.value,objects,strokes,plans}}
function save(){let d=saveData(),all=JSON.parse(localStorage.getItem('coachBoardFinal')||'[]');let id=Date.now();all.unshift({id,...d});localStorage.setItem('coachBoardFinal',JSON.stringify(all.slice(0,50)));toast('ვარჯიში შენახულია 💾');renderSaved()}
function saveAutos(){localStorage.setItem('coachBoardAutosave',JSON.stringify(saveData()))}
$('#save').onclick=save;$('#quickSave').onclick=save;
function load(d){title.value=d.title||'';date.value=d.date||'';duration.value=d.duration||'30 წთ';notes.value=d.notes||'';objects=d.objects||[];strokes=d.strokes||[];plans=d.plans||[];render();toast('ვარჯიში ჩაიტვირთა')}
function renderSaved(){let all=JSON.parse(localStorage.getItem('coachBoardFinal')||'[]'),box=$('#saved');box.innerHTML=all.length?all.map(d=>`<div class="saved"><div><b>${esc(d.title)}</b><span class="small">${d.date||''} • ${d.duration||''}</span></div><div><button class="tool" onclick='loadById(${d.id})'>გახსნა</button><button class="tool danger" onclick='delById(${d.id})'>წაშლა</button></div></div>`).join(''):'<div class="empty">ჯერ შენახული ვარჯიში არ გაქვს.</div>'}
window.loadById=id=>{let d=JSON.parse(localStorage.getItem('coachBoardFinal')||'[]').find(x=>x.id===id);if(d)load(d)}
window.delById=id=>{let a=JSON.parse(localStorage.getItem('coachBoardFinal')||'[]').filter(x=>x.id!==id);localStorage.setItem('coachBoardFinal',JSON.stringify(a));renderSaved()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function renderPlan(){let box=$('#plan');box.innerHTML=plans.length?plans.map((p,i)=>`<div class="planRow"><input value="${esc(p.name)}" oninput="plans[${i}].name=this.value;saveAutosaveOnly()"><input value="${esc(p.min)}" oninput="plans[${i}].min=this.value;saveAutosaveOnly()"><button class="tool danger" onclick="plans.splice(${i},1);renderPlan()">×</button></div>`).join(''):'<div class="empty">დაამატე ვარჯიშის ეტაპები: გახურება → ტექნიკა → ტაქტიკა → თამაში.</div>'}
window.saveAutosaveOnly=()=>localStorage.setItem('coachBoardAutosave',JSON.stringify(saveData()))
$('#addStage').onclick=()=>{plans.push({name:'ახალი ეტაპი',min:'10'});renderPlan();saveAutos()}
window.addEventListener('load',()=>{let a=localStorage.getItem('coachBoardAutosave');if(a){try{let d=JSON.parse(a);if(confirm('ბოლო დაუმთავრებელი ვარჯიში აღვადგინოთ?'))load(d)}catch{}}render()})

function modeHtml(){return ['select','red','blue','ball','cone','man','arrow','line','zone','text','erase'].map(t=>{let names={select:'👆',red:'🔴',blue:'🔵',ball:'⚽',cone:'🔶',man:'🧍',arrow:'➡️',line:'➖',zone:'🟩',text:'T',erase:'🗑️'};return `<button data-tool="${t}" onclick="setToolMode('${t}')">${names[t]}</button>`}).join('')}
$('#modeTools').innerHTML=modeHtml();
window.setToolMode=t=>{tool=t;setModeTool(t)}
function copyToFull(){let fp=$('#fullPitch');fp.innerHTML=`<div class="box left"></div><div class="box right"></div><div class="goal left"></div><div class="goal right"></div><svg class="svgLayer" id="fullSvg" viewBox="0 0 1000 581" preserveAspectRatio="none"></svg>`;objects.forEach(o=>{let el=document.createElement('div');el.className='object';el.style.left=o.x+'%';el.style.top=o.y+'%';if(o.type==='red'||o.type==='blue'){el.className+=' player '+o.type;el.textContent=o.num||''}else if(o.type==='ball'){el.className+=' ball';el.textContent='⚽'}else if(o.type==='cone'){el.className+=' cone';el.textContent='🔶'}else if(o.type==='man'){el.className+=' man';el.textContent='🧍'}else if(o.type==='text'){el.className+=' label';el.textContent=o.text||''}else if(o.type==='zone'){el.className='zone';el.style.width=(o.w||18)+'%';el.style.height=(o.h||18)+'%';el.style.transform='translate(-50%,-50%)'}fp.appendChild(el)});let fs=$('#fullSvg');strokes.forEach(s=>{let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',s.pts.map((q,i)=>(i?'L':'M')+q.x*10+' '+q.y*5.81).join(' '));p.setAttribute('fill','none');p.setAttribute('stroke',s.kind==='arrow'?'#fff':'#ffe56b');p.setAttribute('stroke-width','5');p.setAttribute('stroke-linecap','round');fs.appendChild(p)})}
function openMode(){copyToFull();$('#boardMode').classList.add('show');document.body.style.overflow='hidden';boardMode=true}
function closeMode(){$('#boardMode').classList.remove('show');document.body.style.overflow='';boardMode=false}
$('#boardOpen').onclick=openMode;$('#quickFull').onclick=openMode;$('#closeMode').onclick=closeMode;
$('#fullPitch').addEventListener('pointerdown',e=>{if(e.target!==$('#fullPitch'))return;let r=e.currentTarget.getBoundingClientRect(),p={x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100};if(tool==='red'||tool==='blue'||tool==='ball'||tool==='cone'||tool==='man'||tool==='zone'||tool==='text'){if(tool==='red'||tool==='blue'){let n=prompt('ნომერი?','10');if(n===null)return;objects.push({id:Date.now(),type:tool,x:p.x,y:p.y,num:n})}else if(tool==='text'){let t=prompt('ტექსტი?','ვარჯიში');if(t)objects.push({id:Date.now(),type:'text',x:p.x,y:p.y,text:t})}else if(tool==='zone')objects.push({id:Date.now(),type:'zone',x:p.x,y:p.y,w:20,h:20});else objects.push({id:Date.now(),type:tool,x:p.x,y:p.y});copyToFull();saveAutos()}});

['pointerdown','pointermove','pointerup'].forEach(ev=>$('#boardMode').addEventListener(ev,e=>{if(ev==='pointerdown'&&e.target.id==='fullPitch'){/* handled above */}}));
</script>
</body></html>
