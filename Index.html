<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075b3b">
<title>L-LIVE</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#f3f7f5;
color:#10251c;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}
button,input,select{font:inherit}
button{cursor:pointer;border:0}

.header{
position:sticky;
top:0;
z-index:50;
background:#075b3b;
color:#fff;
padding:13px 15px;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{font-size:25px;font-weight:950}
.sub{font-size:10px;opacity:.75;letter-spacing:.7px}

.container{
max-width:900px;
margin:auto;
padding:12px 12px 80px
}

.nav{
display:flex;
gap:7px;
overflow:auto;
padding:2px 0 12px;
position:sticky;
top:64px;
z-index:30;
background:#f3f7f5
}

.nav button{
background:#fff;
border:1px solid #d9e5df;
border-radius:12px;
padding:10px 13px;
white-space:nowrap;
font-weight:750;
color:#315046
}

.nav button.active{
background:#075b3b;
color:#fff;
border-color:#075b3b
}

.card{
background:#fff;
border:1px solid #e0ebe6;
border-radius:16px;
padding:14px;
margin:10px 0;
box-shadow:0 2px 10px #143d2a0c
}

.title{
font-size:18px;
font-weight:900;
margin:6px 0 12px
}

.muted{
color:#687a72;
font-size:12px
}

.filters{
display:flex;
gap:7px;
overflow:auto;
margin-bottom:8px
}

.pill{
background:#fff;
border:1px solid #d8e4df;
border-radius:18px;
padding:8px 13px;
white-space:nowrap
}

.pill.active{
background:#075b3b;
color:#fff
}

.match{
display:grid;
grid-template-columns:1fr 80px 1fr;
align-items:center;
text-align:center;
gap:10px
}

.team{font-weight:850}

.score{
font-size:23px;
font-weight:950
}

.status{
font-size:11px;
margin-top:4px
}

.live{
color:#d51e2c;
font-weight:900
}

.upcoming{
color:#075b3b;
font-weight:800
}

.finished{
color:#63766e
}

.open{
background:transparent;
width:100%;
padding:0;
text-align:left
}

.comp{
font-size:12px;
color:#63766e;
font-weight:750;
margin-bottom:10px
}

.sectionHead{
display:flex;
justify-content:space-between;
align-items:center
}

.sectionHead h2{
margin:7px 0;
font-size:18px
}

.detail{
display:none
}

.detail.show{
display:block
}

.back{
background:#e7f0ec;
color:#075b3b;
border-radius:10px;
padding:9px 12px;
font-weight:800;
margin-bottom:10px
}

.hero{
background:#075b3b;
color:#fff;
border-radius:18px;
padding:19px
}

.hero .match{
grid-template-columns:1fr 95px 1fr
}

.hero .score{
font-size:38px
}

.tabs{
display:flex;
background:#fff;
border-radius:12px;
overflow:hidden;
margin:12px 0
}

.tab{
flex:1;
background:#fff;
padding:12px
}

.tab.active{
color:#075b3b;
font-weight:900;
border-bottom:3px solid #075b3b
}

.event{
display:flex;
gap:9px;
align-items:center;
padding:11px 0;
border-bottom:1px solid #edf2ef
}

.minute{
width:38px;
font-weight:900
}

.icon{
width:28px;
text-align:center
}

.competition,
.teamRow{
display:flex;
align-items:center;
gap:12px;
padding:13px 4px;
border-bottom:1px solid #edf1ef
}

.badge{
width:42px;
height:42px;
border-radius:11px;
background:#e7f0ec;
display:grid;
place-items:center;
font-size:20px
}

.grow{flex:1}

.arrow{
color:#075b3b;
font-weight:900
}

.table{
width:100%;
border-collapse:collapse;
font-size:13px
}

.table th,
.table td{
padding:9px 5px;
border-bottom:1px solid #edf1ef;
text-align:center
}

.table th:nth-child(2),
.table td:nth-child(2){
text-align:left
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.field{
width:100%;
padding:11px;
border:1px solid #d4e0db;
border-radius:10px;
margin:4px 0 8px;
background:#fff
}

.primary{
background:#075b3b;
color:#fff;
border-radius:10px;
padding:11px 15px;
font-weight:850
}

.danger{
background:#b51d2a;
color:#fff;
border-radius:10px;
padding:9px 12px
}

.smallbtn{
padding:8px 10px;
border-radius:9px;
background:#edf3f0;
color:#075b3b;
font-weight:750
}

.adminbar{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:9px
}

.login{
max-width:420px;
margin:35px auto;
background:#fff;
padding:20px;
border-radius:18px;
box-shadow:0 5px 25px #153c2a18
}

.hidden{
display:none!important
}

.empty{
text-align:center;
padding:30px;
color:#6c7d76
}

@media(max-width:560px){
.grid{grid-template-columns:1fr}
.container{padding:9px}
.match{grid-template-columns:1fr 65px 1fr}
.hero .match{grid-template-columns:1fr 80px 1fr}
.team{font-size:14px}
}
</style>
</head>

<body>

<header class="header">

<div>
<div class="logo">L-LIVE</div>

</div>

🔒 ADMIN

<main class="container">

<div id="publicShell">

<nav class="nav">

</button>

<button onclick="go('results',this)">

<section id="homePage">

<div class="card" style="margin-top:0">

<input
id="searchBox"
class="field"

</div>

<section id="competitionsPage" class="hidden">

<div class="title">

<section id="teamsPage" class="hidden">

<section id="resultsPage" class="hidden">

<section id="detailPage" class="detail">

</button>

<section id="loginPage" class="hidden">

<div class="login">

<h2>🔐 Owner Admin</h2>

<p class="muted">
მხოლოდ აპის მფლობელი შედის აქ.

<input
id="email"
class="field"

<input
id="password"
class="field"
type="password"
placeholder="Password">

class="primary"

</button>

<p id="loginError" class="muted"></p>

</section>

<section id="adminPage" class="hidden">

class="back"

</button>

<div class="card">

<p class="muted">

<span id="adminEmail"></span>
</p>

onclick="logout()">

</button>

<div class="card">

<div class="title">
🏆 ჩემპიონატის დამატება
</div>

<input
id="newComp"

placeholder="მაგ. თბილისის ლიგა 1">

<input
id="newRegion"

placeholder="რეგიონი, მაგ. თბილისი">

class="primary"
onclick="createCompetition()">
დამატება
</button>

</div>

<div class="card">

<div class="title">
⚽ გუნდის დამატება
</div>

<div class="grid">

<input
id="newTeam"
class="field"
placeholder="გუნდის სახელი">

<select
id="newTeamComp"
class="field">

<option value="">
აირჩიე ჩემპიონატი
</option>

</select>

</div>

<button
class="primary"
onclick="createTeam()">
დამატება
</button>

</div>

<div class="card">

<div class="title">
➕ მატჩის დამატება
</div>

<div class="grid">

<select
id="mComp"
class="field">

<option value="">
აირჩიე ჩემპიონატი
</option>

</select>

<input
id="mVenue"
class="field"
placeholder="სტადიონი">

<select
id="mHome"
class="field">

<option value="">
აირჩიე მასპინძელი გუნდი
</option>

</select>

<select
id="mAway"
class="field">

<option value="">
აირჩიე სტუმარი გუნდი
</option>

</select>

<input
id="mDate"
class="field"
type="date">

<input
id="mTime"
class="field"
type="time">

class="primary"

მატჩის შექმნა

</div>

🏆 ჩემი ჩემპიონატები
</div>

<div id="adminCompetitions"></div>

</div>

<div class="card">

<div class="title">
⚽ ჩემი გუნდები
</div>

<div id="adminTeams"></div>

</div>

<div class="card">

<div class="title">
🎮 მატჩების მართვა
</div>

<div id="adminMatches"></div>

</div>

</section>

</main>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
getDatabase,
ref,
onValue,
push,
set,
update,
remove
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig={

apiKey:
"AIzaSyDzCxUHJvIS-TBPJQnDZuuZX7GP_Wt8fHI",

authDomain:
"l-live.firebaseapp.com",

databaseURL:
"https://l-live-default-rtdb.firebaseio.com",

projectId:
"l-live",

storageBucket:
"l-live.firebasestorage.app",

messagingSenderId:
"1080946597468",

appId:
"1:1080946597468:web:17682b7b655f78ef549099",

measurementId:
"G-VS20XDM1MJ"

};

const app=initializeApp(firebaseConfig);

const db=getDatabase(app);

const auth=getAuth(app);

let matches={},
competitions={},
teams={},
admin=false;

let homeFilter="all",
currentId=null,
currentComp=null,
currentTeam=null,
tab="events";

const $=id=>document.getElementById(id);

const esc=s=>
String(s??"")
.replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));

function compName(id){

return competitions[id]?.name ||
id ||
"Football";

}

function teamName(id){

return teams[id]?.name ||
id ||
"—";

}

function statusLabel(m){

if(m.status==="live")
return "LIVE";

if(m.status==="half")
return "ტაიმი";

if(m.status==="finished")
return "დასრულებული";

return `${m.date||""} ${m.time||""}`.trim()
||"მომავალი";

}

function statusClass(m){

return m.status==="live" ||
m.status==="half"
?"live"
:m.status==="finished"
?"finished"
:"upcoming";

}

function matchCard(id,m){

const upcoming=
m.status==="upcoming";

const score=
upcoming
?"— : —"
:`${m.homeScore||0} : ${m.awayScore||0}`;

return `

<div class="card">

<button
class="open"
onclick="openMatch('${id}')">

<div class="comp">

${esc(compName(m.competitionId))}

${m.venue
?" • "+esc(m.venue)
:""}

</div>

<div class="match">

<div class="team">

${esc(
teamName(m.homeTeamId)
||
m.home
||
"Home"
)}

</div>

<div>

<div class="score">

${score}

</div>

<div class="status ${statusClass(m)}">

${statusLabel(m)}

${
(m.status==="live" ||
m.status==="half") &&
m.minute
?` • ${m.minute}'`
:""
}

</div>

</div>

<div class="team">

${esc(
teamName(m.awayTeamId)
||
m.away
||
"Away"
)}

</div>

</div>

</button>

</div>

`;

}

function allMatches(filter){

let a=
Object.entries(matches);

if(filter==="live")
a=a.filter(
([id,m])=>
m.status==="live" ||
m.status==="half"
);

if(filter==="upcoming")
a=a.filter(
([id,m])=>
m.status==="upcoming"
);

if(filter==="finished")
a=a.filter(
([id,m])=>
m.status==="finished"
);

const order={
live:0,
half:0,
upcoming:1,
finished:2
};

a.sort(
(x,y)=>
(order[x[1].status]??3)-
(order[y[1].status]??3)
);

return a;

}

function renderHome(){

const q=
(($("searchBox")?.value)||"")
.trim()
.toLowerCase();

const arr=
allMatches(homeFilter)
.filter(([id,m])=>{

if(!q)
return true;

const text=[
teamName(m.homeTeamId),
teamName(m.awayTeamId),
compName(m.competitionId),
m.home,
m.away,
m.venue,
m.date
]
.join(" ")
.toLowerCase();

return text.includes(q);

});

$("homeList").innerHTML=

arr
.map(([id,m])=>matchCard(id,m))
.join("")

||

`<div class="empty">
მატჩი ვერ მოიძებნა.
</div>`;

}

function renderLive(){

$("liveList").innerHTML=

allMatches("live")
.map(([id,m])=>matchCard(id,m))
.join("")

||

`<div class="empty">
ამ მომენტში LIVE მატჩი არ არის.
</div>`;

}

function renderResults(){

$("resultsList").innerHTML=

allMatches("finished")
.map(([id,m])=>matchCard(id,m))
.join("")

||

`<div class="empty">
შედეგები ჯერ არ არის.
</div>`;

}

function renderCompetitions(){

const a=
Object.entries(competitions);

$("competitionList").innerHTML=

a.length

?

a.map(([id,c])=>`

<div class="card">

<button
class="open"
onclick="openCompetition('${id}')">

<div class="competition">

<div class="badge">
🏆
</div>

<div class="grow">

<b>
${esc(c.name)}
</b>

<div class="muted">
${esc(c.region||"საქართველო")}
</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

</div>

`).join("")

:

`<div class="empty">
ჩემპიონატები ჯერ არ არის.
</div>`;

}

function renderTeams(){

const a=
Object.entries(teams);

$("teamList").innerHTML=

a.length

?

a.map(([id,t])=>`

<div class="card">

<button
class="open"
onclick="openTeam('${id}')">

<div class="teamRow">

<div class="badge">
⚽
</div>

<div class="grow">

<b>
${esc(t.name)}
</b>

<div class="muted">
${esc(compName(t.competitionId))}
</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

</div>

`).join("")

:

`<div class="empty">
გუნდები ჯერ არ არის.
</div>`;

}

function fillAdminSelects(){

const compOptions=
'<option value="">აირჩიე ჩემპიონატი</option>'+
Object.entries(competitions)
.map(([id,c])=>
`<option value="${esc(id)}">
${esc(c.name)}
</option>`)
.join("");

const teamOptions=
'<option value="">აირჩიე გუნდი</option>'+
Object.entries(teams)
.map(([id,t])=>
`<option value="${esc(id)}">
${esc(t.name)}
</option>`)
.join("");

["newTeamComp","mComp"]
.forEach(id=>{

const el=$(id);

if(el){

const old=el.value;

el.innerHTML=compOptions;

if(competitions[old])
el.value=old;

}

});

["mHome","mAway"]
.forEach(id=>{

const el=$(id);

if(el){

const old=el.value;

el.innerHTML=teamOptions;

if(teams[old])
el.value=old;

}

});

}

function renderAdmin(){

if(!admin)
return;

fillAdminSelects();

$("adminEmail").textContent=
auth.currentUser?.email||"";

$("adminCompetitions").innerHTML=

Object.entries(competitions)
.map(([id,c])=>`

<div class="competition">

<div class="grow">

<b>
${esc(c.name)}
</b>

<div class="muted">
ID: ${esc(id)}
•
${esc(c.region||"")}
</div>

</div>

<button
class="danger"
onclick="deleteCompetition('${id}')">
წაშლა
</button>

</div>

`)
.join("")

||

`<div class="empty">
ცარიელია
</div>`;

$("adminTeams").innerHTML=

Object.entries(teams)
.map(([id,t])=>`

<div class="teamRow">

<div class="grow">

<b>
${esc(t.name)}
</b>

<div class="muted">
ID: ${esc(id)}
•
${esc(compName(t.competitionId))}
</div>

</div>

<button
class="danger"
onclick="deleteTeam('${id}')">
წაშლა
</button>

</div>

`)
.join("")

||

`<div class="empty">
ცარიელია
</div>`;

$("adminMatches").innerHTML=

Object.entries(matches)
.map(([id,m])=>`

<div class="card">

<b>

${esc(
teamName(m.homeTeamId)
||
m.home
)}

—

${esc(
teamName(m.awayTeamId)
||
m.away
)}

</b>

<div class="muted">

${esc(compName(m.competitionId))}

•

${statusLabel(m)}

</div>

<div class="adminbar">

<button
class="primary"
onclick="startMatch('${id}')">
▶ LIVE
</button>

<button
class="smallbtn"
onclick="minute('${id}',-1)">
−1
</button>

<button
class="smallbtn"
onclick="minute('${id}',1)">
+1
</button>

<button
class="smallbtn"
onclick="goal('${id}','home')">
⚽ Home
</button>

<button
class="smallbtn"
onclick="goal('${id}','away')">
⚽ Away
</button>

<button
class="smallbtn"
onclick="addEvent('${id}','yellow')">
🟨
</button>

<button
class="smallbtn"
onclick="addEvent('${id}','red')">
🟥
</button>

<button
class="smallbtn"
onclick="addEvent('${id}','sub')">
🔄
</button>

<button
class="smallbtn"
onclick="half('${id}')">
⏸ ტაიმი
</button>

<button
class="primary"
onclick="finish('${id}')">

⚽

function buildStandings(compId){

const map={};


Object.entries(teams)

.filter(
([id,t])=>
t.competitionId===compId
)

.forEach(
([id,t])=>{

map[id]={

id,

name:t.name,

p:0,

w:0,

d:0,

l:0,

gf:0,

ga:0,

pts:0

};

});


Object.values(matches)

.filter(
m=>
m.competitionId===compId &&
m.status==="finished"
)

.forEach(m=>{

if(
!map[m.homeTeamId] ||
!map[m.awayTeamId]
)
return;


const h=
map[m.homeTeamId];

const a=
map[m.awayTeamId];


const hs=
+m.homeScore||0;

const as=
+m.awayScore||0;


h.p++;
a.p++;

h.gf+=hs;
h.ga+=as;

a.gf+=as;
a.ga+=hs;


if(hs>as){

h.w++;
a.l++;
h.pts+=3;

}

else if(hs<as){

a.w++;
h.l++;
a.pts+=3;

}

else{

h.d++;
a.d++;

h.pts++;
a.pts++;

}

});


return Object.values(map)
.sort(
(a,b)=>
(b.pts-a.pts) ||

(
(b.gf-b.ga)-
(a.gf-a.ga)
) ||

(
b.gf-a.gf
)
);

}


function standingsTable(rows){

if(!rows.length)

return `

return `

<table class="table">

<tr>

<th>
#
</th>

<th>
გუნდი
</th>

<th>
თ
</th>

<th>
მ
</th>

<th>
ფ
</th>

<th>
წ
</th>

<th>
ქ
</th>

</tr>


${
rows
.map(
(r,i)=>`

<tr>

<td>
${i+1}
</td>

<td>
${esc(r.name)}
</td>

<td>
${r.p}
</td>

<td>
${r.w}
</td>

<td>
${r.d}
</td>

<td>
${r.l}
</td>

<td>
<b>
${r.pts}
</b>
</td>

</tr>

`
)
.join("")
}

</table>

`;

}

async(id,side)=>{

side,

text:

?teamName(m.homeTeamId)

}`

});

(

side==="home"

)+1,

);
